name: AshteMobile
options:
  bundleIdPrefix: com.ashtemobile
targets:
  AshteMobile:
    type: application
    platform: iOS
    deploymentTarget: "14.0"
    sources:
      - path: AshteMobile/AshteMobileApp.swift
    resources:
      - path: AshteMobile/index.html
      - path: AshteMobile/css
      - path: AshteMobile/app
      - path: AshteMobile/logo.png
    info:
      path: AshteMobile/Info.plist
    settings:
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGNING_ALLOWED: NO
      PRODUCT_BUNDLE_IDENTIFIER: com.ashtemobile.app
schemes:
  AshteMobile:
    build:
      targets:
        AshteMobile: all
